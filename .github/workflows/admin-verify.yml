name: Admin Verify

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'supabase/migrations/**'
      - '.github/workflows/admin-verify.yml'
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'supabase/migrations/**'
      - '.github/workflows/admin-verify.yml'

permissions:
  contents: read

concurrency:
  group: admin-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://admin-build.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
