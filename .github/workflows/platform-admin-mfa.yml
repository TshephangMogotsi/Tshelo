name: Platform Admin MFA E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-auth-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            security/e2e/package-lock.json
      - run: npm ci
      - run: npm ci --prefix admin
      - run: npm ci --prefix security/e2e
      - name: Verify local-only test safeguards
        run: npm run check --prefix security/e2e
      - name: Verify runner Chrome
        run: google-chrome --version
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.113.0
      - name: Prepare isolated stack configuration
        run: node security/e2e/prepare-stack.mjs
      - name: Start disposable Auth and migrated database
        run: |
          if ! supabase start --workdir "$RUNNER_TEMP/tshelo-mfa-stack" \
            --exclude studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta \
            > "$RUNNER_TEMP/mfa-supabase-start.log" 2>&1; then
            node security/e2e/report-start-failure.mjs
            exit 1
          fi
      - name: Inspect required profile grants
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres
          --set ON_ERROR_STOP=1 --command
          "SELECT has_table_privilege('service_role','public.users','SELECT') AS service_read,
          has_table_privilege('service_role','public.users','UPDATE') AS service_update,
          has_table_privilege('authenticated','public.users','SELECT') AS caller_read;"
      - name: Read disposable credentials without printing them
        run: >-
          supabase status --workdir "$RUNNER_TEMP/tshelo-mfa-stack"
          --output json > "$RUNNER_TEMP/mfa-supabase.json"
      - name: Configure app and tests for loopback services
        run: node security/e2e/export-env.mjs
      - name: Build admin app against disposable Supabase
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run build --prefix admin
      - name: Verify browser MFA, API and database enforcement
        run: npm test --prefix security/e2e
      - name: Inspect sanitized Auth errors
        if: failure()
        run: node security/e2e/report-auth-failure.mjs
      - name: Upload sanitized test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-admin-mfa-evidence
          path: security/e2e/mfa-e2e-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop disposable stack
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/tshelo-mfa-stack" --no-backup
