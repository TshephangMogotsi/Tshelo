project_id = "albihofmlafjzbusancu"

# Public invite-preview page. It performs a service-role lookup through the
# deliberately narrow find_fund_by_code RPC and never exposes fund records.
[functions.fund-preview]
verify_jwt = false

# Database Webhooks authenticate this function with PUSH_WEBHOOK_SECRET rather
# than a user JWT.
[functions.send-push]
verify_jwt = false

# Authenticator-app MFA used by platform administrators. Hosted settings must
# also be checked before rollout; local config does not change hosted Auth.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
